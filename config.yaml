# Central configuration - single source of truth for seeds, universe, limits.
sample:
  start: "2015-01-01"

universe:
  etfs: [XLK, XLF, XLE, XLV, XLI, XLY, XLP, XLU, XLB, SPY]
  # Equity sleeve FROZEN at M2 (2026-09): MSFT dropped - mega-cap tech overlap
  # with AAPL duplicates exposure XLK already carries; four names, four sectors.
  equity_sleeve: [AAPL, JPM, JNJ, XOM]

macro:
  fred_series: [VIXCLS, DGS10, T10Y2Y, DFF, CPIAUCSL]  # per-series availability checked at first pull

seeds:
  numpy: 42
  random: 42
  tensorflow: 42

features:
  vol_window: 21
  mom_window: 63

cleaning:
  ffill_limit: 5
  max_missing_days: 10
  winsor: [0.005, 0.995]

splits:                      # working split, finalized with the team at M3
  train_start: "2015-01-01"
  train_end: "2021-12-31"
  valid_start: "2022-01-01"
  valid_end: "2022-12-31"
  test_start: "2023-01-01"

allocation:
  w_max: 0.35                # per-asset position bound
  turnover_cap: 0.25         # max L1 turnover per rebalance
  vol_target: 0.12           # ex-ante annualized volatility target
  gamma: 8.0                 # risk aversion in the mean-variance objective
  lambda_shrink_blend: 0.5   # LSTM covariance vs Ledoit-Wolf blend weight

backtest:
  rebalance: "W-FRI"
  cost_per_side: 0.0010      # 10 bps per side, benchmark-favorable
